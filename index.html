<body>
<!-- The garden is drawn on this canvas. Everything else is ordinary HTML, built by src/ui/. -->
<canvas id="garden"></canvas>
<header id="topbar"></header>
<aside id="panel"></aside>
<div id="zoom"></div>

<div id="library" hidden>
  <header>
    <h1>My Gardens</h1>
    <button id="restoreBtn" title="Load gardens from a backup file">Restore from backup</button>
    <button id="backupBtn" title="Save all your gardens to a file">Download a backup</button>
    <button id="newBtn" class="go">New garden</button>
  </header>
  <div id="empty"><b>No gardens yet.</b><br>Click <b>New garden</b> to start designing.</div>
  <div id="cards"></div>
  <input id="restoreFile" type="file" accept=".json,application/json" hidden>
</div>

<div id="dialog" hidden>
  <div class="box">
    <h2 id="dlgTitle"></h2>
    <p id="dlgText"></p>
    <input id="dlgInput" maxlength="40" hidden>
    <div class="buttons" id="dlgButtons"></div>
  </div>
</div>
</body>
</html>
